<script src="digest-data.js"></script><script src="lang.js"></script><script src="theme.js"></script>
<script>
const ISSUE=6;const copy={zh:{title:'把好奇心，<br>放回屏幕里',deck:'十个让你重新打开浏览器的设计、工具和微小发现。',date:'第 006 期 · 2026 年 8 月 17 日',read:'阅读原文 ↗'},en:{title:'Put curiosity<br>back on screen',deck:'Ten design signals, useful tools, and small reasons to open the browser again.',date:'Issue 006 · August 17, 2026',read:'Read source ↗'}};
function renderIssue(){const lang=DigestLanguage.get();const text=copy[lang];document.querySelector('[data-issue-date]').textContent=text.date;document.querySelector('[data-issue-title]').innerHTML=text.title;document.querySelector('[data-issue-deck]').textContent=text.deck;document.querySelector('[data-issue-stories]').innerHTML=DIGEST_ENTRIES.filter(entry=>entry.issue===ISSUE).sort((a,b)=>a.position-b.position).map((entry,index)=>`<article class="story${index===0?' featured':''}"><div class="art"><img loading="${index===0?'eager':'lazy'}" decoding="async"${index===0?' fetchpriority="high"':''} src="${entry.image}" alt=""><span>${String(entry.position).padStart(2,'0')}</span></div>${index===0?`<div class="meta">${entry[lang].tags}</div>`:''}<div class="copy"><h2>${entry[lang].title}</h2><p>${entry[lang].description}</p><a href="${entry.url}" target="_blank" rel="noreferrer">${text.read}</a></div></article>`).join('')}
document.addEventListener('digest:language',renderIssue);renderIssue();
</script>
