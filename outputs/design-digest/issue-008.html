<script>
const ISSUE=8;const copy={zh:{title:'把个性<br>写进网页',deck:'从七个个人网站出发，看看交互、教学与设计流程还能怎样表达。',date:'第 008 期 · 2026 年 10 月 12 日',read:'阅读原文 ↗'},en:{title:'Personality,<br>built into the web',deck:'Seven personal sites, plus fresh ways to explore interaction, learning, and design workflows.',date:'Issue 008 · October 12, 2026',read:'Read source ↗'}};
function renderIssue(){const lang=DigestLanguage.get();const text=copy[lang];document.querySelector('[data-issue-date]').textContent=text.date;document.querySelector('[data-issue-title]').innerHTML=text.title;document.querySelector('[data-issue-deck]').textContent=text.deck;document.querySelector('[data-issue-stories]').innerHTML=DIGEST_ENTRIES.filter(entry=>entry.issue===ISSUE).sort((a,b)=>a.position-b.position).map((entry,index)=>`<article class="story${index===0?' featured':''}"><div class="art"><img loading="${index===0?'eager':'lazy'}" decoding="async"${index===0?' fetchpriority="high"':''} src="${entry.image}" alt="${entry[lang].title}"><span>${String(entry.position).padStart(2,'0')}</span></div>${index===0?`<div class="meta">${entry[lang].tags}</div>`:''}<div class="copy"><h2>${entry[lang].title}</h2><p>${entry[lang].description}</p><a href="${entry.url}" target="_blank" rel="noopener noreferrer">${text.read}</a></div></article>`).join('')}
document.addEventListener('digest:language',renderIssue);renderIssue();
</script>
